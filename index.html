<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Splat Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #111; touch-action: none; }
  #app { width: 100%; height: 100%; position: relative; }
  #hud {
    position: absolute; top: max(8px, env(safe-area-inset-top)); left: 8px; right: 8px;
    display: flex; gap: 6px; flex-wrap: wrap; z-index: 20; pointer-events: none;
  }
  .chip {
    background: rgba(0,0,0,.62); color: #fff; font: 12px/1.6 system-ui, sans-serif;
    padding: 3px 10px; border-radius: 999px; white-space: nowrap;
  }
  #toolbar {
    position: absolute; bottom: max(14px, env(safe-area-inset-bottom)); left: 0; right: 0;
    display: flex; justify-content: center; gap: 12px; z-index: 20;
  }
  #openBtn {
    background: #2563eb; color: #fff; border: none; border-radius: 24px;
    padding: 12px 28px; font-size: 15px; box-shadow: 0 4px 14px rgba(0,0,0,.45);
  }
  #settingsBtn {
    position: absolute; top: max(8px, env(safe-area-inset-top)); right: 8px;
    width: 40px; height: 40px; border-radius: 50%; border: none;
    background: rgba(0,0,0,.62); color: #fff; font-size: 20px; z-index: 30;
  }
  #settingsPanel {
    position: absolute; top: max(56px, calc(env(safe-area-inset-top) + 48px)); right: 8px;
    width: 240px; background: rgba(20,20,24,.94); border-radius: 14px;
    padding: 14px; z-index: 30; display: none; color: #eee; font: 13px system-ui;
    box-shadow: 0 6px 22px rgba(0,0,0,.5);
  }
  #settingsPanel.open { display: block; }
  #settingsPanel .row { margin-bottom: 12px; }
  #settingsPanel label { display: flex; justify-content: space-between; margin-bottom: 4px; }
  #settingsPanel input[type=range] { width: 100%; }
  #settingsPanel .toggle { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  #settingsPanel input[type=checkbox] { width: 18px; height: 18px; }
  #hint {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 10px;
    align-items: center; justify-content: center; color: #888; z-index: 10;
    font: 14px system-ui; text-align: center; padding: 0 32px;
  }
</style>
</head>
<body>
<div id="app">
  <div id="hud"></div>
  <button id="settingsBtn">⚙️</button>
  <div id="settingsPanel">
    <div class="row">
      <label><span>旋转灵敏度</span><span id="sensVal">0.3</span></label>
      <input id="sensRange" type="range" min="0.1" max="1.0" step="0.05" value="0.3">
    </div>
    <div class="toggle"><span>地面网格</span><input id="gridToggle" type="checkbox"></div>
    <div class="toggle"><span>坐标轴</span><input id="axesToggle" type="checkbox"></div>
    <div class="toggle"><span>模型变换模式</span><input id="xformToggle" type="checkbox"></div>
    <div style="margin-top:8px; color:#888; font-size:11px">变换模式：单指拖=移动模型，双指捏合=缩放模型</div>
  </div>
  <div id="hint">
    <div style="font-size:40px">🔮</div>
    <div>点击下方按钮选择 .ply / .splat / .ksplat 文件<br>全程本地处理，不联网</div>
  </div>
  <div id="toolbar">
    <button id="openBtn">📂 打开模型</button>
  </div>
  <input id="fileInput" type="file" accept=".ply,.splat,.ksplat" style="display:none">
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
